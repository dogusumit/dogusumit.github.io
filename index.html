<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dogusumit - github</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff;
            color: #0f172a;
            padding: 24px;
            line-height: 1.5;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .avatar-img {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.08);
            border: 3px solid #ffffff;
            outline: 1px solid #e2e8f0;
            transition: transform 0.25s ease;
        }

        .avatar-img:hover {
            transform: scale(1.04);
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            text-decoration: none;
            color: inherit;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.04);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(15, 23, 42, 0.08);
            border-color: #cbd5e1;
        }

        .card-icon {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
            transition: transform 0.25s ease;
        }

        .icon-blue {
            background: #eff6ff;
            color: #2563eb;
        }

        .icon-green {
            background: #ecfdf5;
            color: #10b981;
        }

        .icon-purple {
            background: #f5f3ff;
            color: #8b5cf6;
        }

        .card:hover .card-icon {
            transform: scale(1.08);
        }

        .card-content {
            flex: 1;
            min-width: 0;
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 2px;
        }

        .card-title {
            font-size: 15px;
            font-weight: 600;
            color: #0f172a;
        }

        .badge {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 999px;
            background: #f1f5f9;
            color: #475569;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .card-desc {
            font-size: 13px;
            color: #64748b;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .arrow {
            color: #94a3b8;
            font-size: 18px;
            transition: transform 0.25s ease, color 0.25s ease;
            flex-shrink: 0;
        }

        .card:hover .arrow {
            transform: translateX(4px);
            color: #2563eb;
        }

        footer {
            margin-top: 32px;
            text-align: center;
            font-size: 13px;
            color: #94a3b8;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        footer a {
            color: #64748b;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #0f172a;
            text-decoration: underline;
        }

        footer .separator {
            opacity: 0.4;
        }
    </style>
</head>

<body>

    <div class="container">
        <header class="header">
            <img src="https://avatars.githubusercontent.com/u/31733984" alt="Avatar" class="avatar-img">
        </header>

        <main class="links">
            <!-- Tarih Hesapla -->
            <a href="tarih-hesapla.html" class="card">
                <div class="card-icon icon-blue">
                    📅
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <span class="card-title">Tarih Hesapla</span>
                        <span class="badge">Web</span>
                    </div>
                    <div class="card-desc">İki tarih arasındaki gün sayısını hesaplayın</div>
                </div>
                <div class="arrow">→</div>
            </a>

            <!-- Mola Hesapla -->
            <a href="mola-hesapla.html" class="card">
                <div class="card-icon icon-green">
                    ⏱️
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <span class="card-title">Mola Hesapla</span>
                        <span class="badge">Web</span>
                    </div>
                    <div class="card-desc">Mola başlangıç ve bitiş saatlerini hesaplayın</div>
                </div>
                <div class="arrow">→</div>
            </a>

            <!-- SMS2API APK -->
            <a href="https://github.com/dogusumit/sms2api/releases/download/v.1.0.0/SMS2API-v1.0.0.apk" class="card"
                target="_blank" rel="noopener noreferrer">
                <div class="card-icon icon-purple">
                    📱
                </div>
                <div class="card-content">
                    <div class="card-header">
                        <span class="card-title">SMS2API</span>
                        <span class="badge">APK v1.0.0</span>
                    </div>
                    <div class="card-desc">Android SMS aktarım uygulaması (İndir)</div>
                </div>
                <div class="arrow">↓</div>
            </a>
        </main>

        <footer>
            <a href="https://github.com/dogusumit" target="_blank" rel="noopener noreferrer">GitHub</a>
            <span class="separator">•</span>
            <a href="privacy-policy.txt" target="_blank">Gizlilik Politikası</a>
        </footer>
    </div>

</body>

</html>
